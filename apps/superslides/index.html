<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Slide Creator</title>
    <!-- Local KaTeX CSS -->
    <link rel="stylesheet" href="libs/katex.min.css">
    <!-- Local KaTeX JS -->
    <script defer src="libs/katex.min.js"></script>
    <script defer src="libs/auto-render.min.js" onload="renderAllMath()"></script>
    <!-- Local html2canvas -->
    <script src="libs/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --slide-width: 1920px;
            --slide-height: 1080px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        .view {
            display: none;
            width: 100vw;
            height: 100vh;
        }

        .view.active {
            display: flex;
        }

        #welcome-view {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        .welcome-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 16px;
            width: 450px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .welcome-card h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .welcome-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            margin-bottom: 12px;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .existing-projects {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .project-list {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 8px;
        }

        .project-item {
            padding: 8px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .project-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        #editor-view {
            flex-direction: row;
            width: 100vw;
            height: 100vh;
        }

        .slides-sidebar {
            width: 260px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 {
            font-size: 14px;
            font-weight: 600;
        }

        .slides-thumb-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .thumb-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
        }

        .thumb-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            padding: 0 2px;
        }

        .slide-thumb {
            aspect-ratio: 16 / 9;
            background: #ffffff;
            border-radius: 6px;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
        }

        .thumb-container.active .slide-thumb {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        .thumb-container.active .thumb-label-row {
            color: var(--text-main);
            font-weight: 500;
        }

        .thumb-canvas-scaler {
            width: var(--slide-width);
            height: var(--slide-height);
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            transform: scale(0.12);
            pointer-events: none;
            background: #ffffff;
        }

        .thumb-element {
            position: absolute;
            box-sizing: border-box;
        }

        .slide-thumb-add {
            aspect-ratio: 16 / 9;
            background: rgba(255, 255, 255, 0.02);
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-size: 12px;
            gap: 4px;
            transition: all 0.2s;
        }

        .slide-thumb-add:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-color);
            color: var(--text-main);
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .export-dropdown {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .export-menu {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            margin-bottom: 4px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            z-index: 50;
            overflow: hidden;
        }

        .export-menu.show {
            display: block;
        }

        .export-menu-item {
            padding: 10px 12px;
            font-size: 12px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
        }

        .export-menu-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .sidebar-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            width: 100%;
        }

        .sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-color);
        }

        .workspace-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #090d16;
            height: 100vh;
            overflow: hidden;
        }

        .editor-toolbar {
            height: 60px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 12px;
        }

        .toolbar-btn {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-color);
        }

        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px;
            overflow: auto;
        }

        .slide-canvas {
            width: var(--slide-width);
            height: var(--slide-height);
            aspect-ratio: 16 / 9;
            background-color: #ffffff;
            border-radius: 4px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            color: #0f172a;
            overflow: hidden;
            flex-shrink: 0;
            transform: scale(0.5);
            transform-origin: center center;
        }

        .katex-mathml {
            display: none !important;
        }

        .canvas-element {
            position: absolute;
            user-select: none;
            box-sizing: border-box;
        }

        .canvas-element.selected {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .element-text {
            padding: 8px;
            outline: none;
            border-radius: 4px;
            word-break: break-word;
            cursor: text;
        }

        .element-shape {
            border-radius: 4px;
            cursor: move;
        }

        .properties-sidebar {
            width: 280px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .properties-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 600;
        }

        .properties-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .prop-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .prop-group label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .prop-row {
            display: flex;
            gap: 8px;
        }

        .prop-row .prop-group {
            flex: 1;
        }

        .prop-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            width: 100%;
            outline: none;
        }

        .prop-control:focus {
            border-color: var(--accent-color);
        }

        select.prop-control option {
            background-color: var(--panel-bg);
            color: var(--text-main);
        }

        .no-selection {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            margin-top: 40px;
            line-height: 1.5;
        }

        .print-export-container {
            display: none;
        }
    </style>
</head>
<body>

<div id="welcome-view" class="view active">
    <div class="welcome-card">
        <h1>Slide Studio</h1>
        <p>Local Markdown, LaTeX, and Freeform presentation builder.</p>
        <button class="btn btn-primary" onclick="createNewProject()">+ Create New Project</button>
        <div class="existing-projects">
            <p style="font-size: 12px; margin-bottom: 6px;">Open Existing Project:</p>
            <ul class="project-list" id="project-list">
                <li class="project-item" onclick="openProject('Sample Presentation')">
                    <span>Sample Presentation with Math</span>
                    <span style="font-size: 11px;">3 slides</span>
                </li>
            </ul>
        </div>
    </div>
</div>

<div id="editor-view" class="view">
    <div class="slides-sidebar">
        <div class="sidebar-header">
            <h3>Project Slides</h3>
        </div>
        <div class="slides-thumb-list" id="slides-thumb-list"></div>

        <div class="sidebar-footer">
            <div class="export-dropdown">
                <div class="export-menu" id="export-menu">
                    <button class="export-menu-item" onclick="triggerExport('html')">
                        <span>🌐</span> Export as Interactive HTML
                    </button>
                    <button class="export-menu-item" onclick="triggerExport('pdf')">
                        <span>📄</span> Export as PDF
                    </button>
                </div>
                <button class="sidebar-btn" onclick="toggleExportMenu(event)">
                    <span>📥</span> Export Presentation... <span style="margin-left: auto;">▲</span>
                </button>
            </div>
            <button class="sidebar-btn" onclick="goToHome()">
                <span>←</span> Back to Home
            </button>
        </div>
    </div>

    <div class="workspace-container">
        <div class="editor-toolbar">
            <button class="toolbar-btn" onclick="addElement('text')">
                <span>📝</span> Add Text Box
            </button>
            <button class="toolbar-btn" onclick="addElement('shape')">
                <span>⬛</span> Add Rectangle
            </button>
            <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
                <label style="font-size: 12px; color: var(--text-muted);">Slide Size:</label>
                <select id="global-slide-size" class="prop-control" style="width: 200px;"
                        onchange="changeSlideSizePreset(this.value)">
                    <option value="1920x1080" selected>16:9 Full HD (1920x1080)</option>
                    <option value="960x540">16:9 Standard (960x540)</option>
                    <option value="1280x960">4:3 Standard (1280x960)</option>
                    <option value="custom">Custom Size...</option>
                </select>
            </div>
        </div>

        <div class="workspace" id="workspace-area">
            <div class="slide-canvas" id="slide-canvas"></div>
        </div>
    </div>

    <div class="properties-sidebar">
        <div class="properties-header">Properties</div>
        <div class="properties-body" id="properties-body">
            <div class="no-selection">Select an object on the canvas to inspect and customize its properties.</div>
        </div>
    </div>
</div>

<div id="print-export-container" class="print-export-container"></div>

<script>
    let slides = [];
    let currentSlideIndex = 0;
    let selectedElementIndex = null;
    let slideWidth = 1920;
    let slideHeight = 1080;

    function showView(viewId) {
        document.querySelectorAll('.view').forEach(v => {
            v.classList.remove('active');
            v.style.display = 'none';
        });
        const target = document.getElementById(viewId);
        target.classList.add('active');
        target.style.display = 'flex';
    }

    function toggleExportMenu(e) {
        e.stopPropagation();
        const menu = document.getElementById('export-menu');
        menu.classList.toggle('show');
    }

    window.addEventListener('click', () => {
        const menu = document.getElementById('export-menu');
        if (menu) menu.classList.remove('show');
    });

    function createNewProject() {
        slides = [
            {id: 1, title: "Title Slide", elements: []}
        ];
        currentSlideIndex = 0;
        selectedElementIndex = null;
        showView('editor-view');
        renderEditor();
    }

    function openProject(projectName) {
        slides = [
            {
                id: 1,
                title: "Introduction",
                elements: [
                    {
                        type: 'text',
                        x: 200,
                        y: 200,
                        width: 800,
                        height: 160,
                        content: 'Welcome to Slide Studio with LaTeX: $E = mc^2$',
                        fontSize: 42,
                        fontFamily: 'sans-serif',
                        fontColor: '#0f172a',
                        bg: 'transparent',
                        borderCol: 'transparent',
                        borderWidth: 0,
                        borderStyle: 'solid'
                    },
                    {
                        type: 'shape',
                        x: 200,
                        y: 440,
                        width: 500,
                        height: 240,
                        bg: '#3b82f6',
                        borderCol: '#1e40af',
                        borderWidth: 4,
                        borderStyle: 'solid'
                    }
                ]
            },
            {
                id: 2, title: "Math Equations", elements: [
                    {
                        type: 'text',
                        x: 200,
                        y: 200,
                        width: 1000,
                        height: 200,
                        content: 'Quadratic formula: $x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$',
                        fontSize: 36,
                        fontFamily: 'sans-serif',
                        fontColor: '#0f172a',
                        bg: 'transparent',
                        borderCol: 'transparent',
                        borderWidth: 0,
                        borderStyle: 'solid'
                    }
                ]
            },
            {id: 3, title: "Conclusion", elements: []}
        ];
        currentSlideIndex = 0;
        selectedElementIndex = null;
        showView('editor-view');
        renderEditor();
    }

    function goToHome() {
        showView('welcome-view');
    }

    function addSlide() {
        const newSlideId = slides.length + 1;
        slides.push({id: newSlideId, title: `Slide ${newSlideId}`, elements: []});
        currentSlideIndex = slides.length - 1;
        selectedElementIndex = null;
        renderEditor();
    }

    function selectSlide(index) {
        currentSlideIndex = index;
        selectedElementIndex = null;
        renderEditor();
    }

    function changeSlideSizePreset(val) {
        if (val === '1920x1080') {
            slideWidth = 1920;
            slideHeight = 1080;
        } else if (val === '960x540') {
            slideWidth = 960;
            slideHeight = 540;
        } else if (val === '1280x960') {
            slideWidth = 1280;
            slideHeight = 960;
        } else if (val === 'custom') {
            const w = prompt("Enter slide width in pixels:", slideWidth);
            const h = prompt("Enter slide height in pixels:", slideHeight);
            if (w && h && !isNaN(w) && !isNaN(h)) {
                slideWidth = parseInt(w);
                slideHeight = parseInt(h);
            }
        }
        updateDimensionsCSS();
        renderEditor();
    }

    function updateDimensionsCSS() {
        document.documentElement.style.setProperty('--slide-width', `${slideWidth}px`);
        document.documentElement.style.setProperty('--slide-height', `${slideHeight}px`);
    }

    function addElement(type) {
        const currentSlide = slides[currentSlideIndex];
        const scaleFactor = slideWidth / 1920;
        const newElement = {
            type: type,
            x: Math.round(200 + (currentSlide.elements.length * 30)),
            y: Math.round(200 + (currentSlide.elements.length * 30)),
            width: type === 'text' ? Math.round(600 * scaleFactor) : Math.round(350 * scaleFactor),
            height: type === 'text' ? Math.round(150 * scaleFactor) : Math.round(200 * scaleFactor),
            content: type === 'text' ? 'Type text or math like $x^2 + y^2 = r^2$' : '',
            bg: type === 'text' ? 'transparent' : '#cbd5e1',
            borderCol: type === 'text' ? 'transparent' : '#64748b',
            borderWidth: type === 'text' ? 0 : 2,
            borderStyle: 'solid',
            fontSize: Math.round(32 * scaleFactor),
            fontFamily: 'sans-serif',
            fontColor: '#0f172a'
        };
        currentSlide.elements.push(newElement);
        selectedElementIndex = currentSlide.elements.length - 1;
        renderEditor();
    }

    function renderKatexContent(element, rawText) {
        element.innerHTML = rawText;
        if (window.renderMathInElement) {
            try {
                renderMathInElement(element, {
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "$", right: "$", display: false},
                        {left: "\\(", right: "\\)", display: false},
                        {left: "\\[", right: "\\]", display: true}
                    ],
                    throwOnError: false
                });
            } catch (e) {
                console.error("KaTeX rendering error:", e);
            }
        }
    }

    function renderAllMath() {
        renderEditor();
    }

    function renderEditor() {
        updateDimensionsCSS();
        const thumbList = document.getElementById('slides-thumb-list');
        thumbList.innerHTML = '';

        slides.forEach((slide, idx) => {
            const container = document.createElement('div');
            container.className = `thumb-container ${idx === currentSlideIndex ? 'active' : ''}`;
            container.onclick = () => selectSlide(idx);

            const labelRow = document.createElement('div');
            labelRow.className = 'thumb-label-row';
            labelRow.innerHTML = `<span>${slide.title}</span><span>${idx + 1}</span>`;

            const thumb = document.createElement('div');
            thumb.className = `slide-thumb`;

            const scaler = document.createElement('div');
            scaler.className = 'thumb-canvas-scaler';

            slide.elements.forEach(el => {
                const thumbEl = document.createElement('div');
                thumbEl.className = `thumb-element ${el.type === 'text' ? 'element-text' : 'element-shape'}`;
                thumbEl.style.left = `${el.x}px`;
                thumbEl.style.top = `${el.y}px`;
                thumbEl.style.width = `${el.width}px`;
                thumbEl.style.height = `${el.height}px`;
                thumbEl.style.backgroundColor = el.bg;
                thumbEl.style.borderColor = el.borderCol;
                thumbEl.style.borderWidth = `${el.borderWidth}px`;
                thumbEl.style.borderStyle = el.borderStyle;

                if (el.type === 'text') {
                    thumbEl.style.fontSize = `${el.fontSize}px`;
                    thumbEl.style.fontFamily = el.fontFamily;
                    thumbEl.style.color = el.fontColor;
                    renderKatexContent(thumbEl, el.content);
                }
                scaler.appendChild(thumbEl);
            });

            thumb.appendChild(scaler);
            container.appendChild(labelRow);
            container.appendChild(thumb);
            thumbList.appendChild(container);
        });

        const addThumb = document.createElement('div');
        addThumb.className = 'slide-thumb-add';
        addThumb.onclick = () => addSlide();
        addThumb.innerHTML = `
                <span style="font-size: 16px; font-weight: bold;">+</span>
                <span>Add Slide</span>
            `;
        thumbList.appendChild(addThumb);

        renderCanvas();
        renderPropertiesPanel();
    }

    function renderCanvas() {
        const canvas = document.getElementById('slide-canvas');
        canvas.innerHTML = '';

        const currentSlide = slides[currentSlideIndex];
        if (!currentSlide) return;

        currentSlide.elements.forEach((el, elIndex) => {
            const domEl = document.createElement('div');
            domEl.className = `canvas-element ${el.type === 'text' ? 'element-text' : 'element-shape'}`;
            if (selectedElementIndex === elIndex) {
                domEl.classList.add('selected');
            }

            domEl.style.left = `${el.x}px`;
            domEl.style.top = `${el.y}px`;
            domEl.style.width = `${el.width}px`;
            domEl.style.height = `${el.height}px`;
            domEl.style.backgroundColor = el.bg;
            domEl.style.borderColor = el.borderCol;
            domEl.style.borderWidth = `${el.borderWidth}px`;
            domEl.style.borderStyle = el.borderStyle;

            if (el.type === 'text') {
                domEl.style.fontSize = `${el.fontSize}px`;
                domEl.style.fontFamily = el.fontFamily;
                domEl.style.color = el.fontColor;
                domEl.contentEditable = "true";

                if (selectedElementIndex === elIndex) {
                    domEl.innerText = el.content;
                } else {
                    renderKatexContent(domEl, el.content);
                }

                domEl.oninput = (e) => {
                    el.content = e.target.innerText;
                    updateThumbnailLive();
                };
            }

            domEl.onmousedown = (e) => {
                const rect = domEl.getBoundingClientRect();
                const scale = 0.5;
                const x = (e.clientX - rect.left) / scale;
                const y = (e.clientY - rect.top) / scale;
                const threshold = 12;

                const isLeft = x < threshold;
                const isRight = x > (el.width - threshold);
                const isTop = y < threshold;
                const isBottom = y > (el.height - threshold);
                const isResizing = isLeft || isRight || isTop || isBottom;

                if (selectedElementIndex !== elIndex) {
                    selectedElementIndex = elIndex;
                    renderCanvas();
                    renderPropertiesPanel();
                }

                const isCtrlMove = e.ctrlKey || e.metaKey;

                const startX = e.clientX;
                const startY = e.clientY;
                const origX = el.x;
                const origY = el.y;
                const origW = el.width;
                const origH = el.height;
                let hasDragged = false;

                function onMouseMove(moveEvent) {
                    const dx = (moveEvent.clientX - startX) / scale;
                    const dy = (moveEvent.clientY - startY) / scale;

                    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
                        hasDragged = true;
                    }

                    if (isCtrlMove && hasDragged) {
                        el.x = origX + dx;
                        el.y = origY + dy;
                        domEl.style.left = `${el.x}px`;
                        domEl.style.top = `${el.y}px`;
                    } else if (isResizing) {
                        if (isRight) el.width = Math.max(50, origW + dx);
                        if (isBottom) el.height = Math.max(40, origH + dy);
                        if (isLeft) {
                            const newW = origW - dx;
                            if (newW > 50) {
                                el.width = newW;
                                el.x = origX + dx;
                            }
                        }
                        if (isTop) {
                            const newH = origH - dy;
                            if (newH > 40) {
                                el.height = newH;
                                el.y = origY + dy;
                            }
                        }

                        domEl.style.left = `${el.x}px`;
                        domEl.style.top = `${el.y}px`;
                        domEl.style.width = `${el.width}px`;
                        domEl.style.height = `${el.height}px`;
                    }

                    const xInput = document.getElementById('prop-x');
                    const yInput = document.getElementById('prop-y');
                    if (xInput) xInput.value = Math.round(el.x);
                    if (yInput) yInput.value = Math.round(el.y);
                    updateThumbnailLive();
                }

                function onMouseUp() {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                    renderPropertiesPanel();
                    if (hasDragged && isCtrlMove) {
                        renderEditor();
                    }
                }

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);

                if (!isResizing && !isCtrlMove && el.type === 'text') {
                    return;
                }
                e.stopPropagation();
            };

            canvas.appendChild(domEl);
        });
    }

    function updateThumbnailLive() {
        const activeContainer = document.querySelectorAll('.thumb-container')[currentSlideIndex];
        if (!activeContainer) return;
        const scaler = activeContainer.querySelector('.thumb-canvas-scaler');
        if (!scaler) return;

        scaler.innerHTML = '';
        slides[currentSlideIndex].elements.forEach(el => {
            const thumbEl = document.createElement('div');
            thumbEl.className = `thumb-element ${el.type === 'text' ? 'element-text' : 'element-shape'}`;
            thumbEl.style.left = `${el.x}px`;
            thumbEl.style.top = `${el.y}px`;
            thumbEl.style.width = `${el.width}px`;
            thumbEl.style.height = `${el.height}px`;
            thumbEl.style.backgroundColor = el.bg;
            thumbEl.style.borderColor = el.borderCol;
            thumbEl.style.borderWidth = `${el.borderWidth}px`;
            thumbEl.style.borderStyle = el.borderStyle;

            if (el.type === 'text') {
                thumbEl.style.fontSize = `${el.fontSize}px`;
                thumbEl.style.fontFamily = el.fontFamily;
                thumbEl.style.color = el.fontColor;
                renderKatexContent(thumbEl, el.content);
            }
            scaler.appendChild(thumbEl);
        });
    }

    document.getElementById('slide-canvas').onclick = (e) => {
        if (e.target.id === 'slide-canvas') {
            selectedElementIndex = null;
            renderCanvas();
            renderPropertiesPanel();
        }
    };

    function renderPropertiesPanel() {
        const panelBody = document.getElementById('properties-body');
        const currentSlide = slides[currentSlideIndex];

        if (selectedElementIndex === null || !currentSlide || !currentSlide.elements[selectedElementIndex]) {
            panelBody.innerHTML = `<div class="no-selection">Select an object on the canvas to inspect and customize its properties.</div>`;
            return;
        }

        const el = currentSlide.elements[selectedElementIndex];

        let html = `
                <div class="prop-group">
                    <label>Object Type</label>
                    <input type="text" class="prop-control" value="${el.type === 'text' ? 'Text Box' : 'Rectangle Shape'}" disabled style="opacity: 0.6;">
                </div>
                <div class="prop-row">
                    <div class="prop-group">
                        <label>X Position</label>
                        <input type="number" id="prop-x" class="prop-control" value="${Math.round(el.x)}" oninput="updateProp('x', this.value)">
                    </div>
                    <div class="prop-group">
                        <label>Y Position</label>
                        <input type="number" id="prop-y" class="prop-control" value="${Math.round(el.y)}" oninput="updateProp('y', this.value)">
                    </div>
                </div>
                <div class="prop-row">
                    <div class="prop-group">
                        <label>Width</label>
                        <input type="number" class="prop-control" value="${Math.round(el.width)}" oninput="updateProp('width', this.value)">
                    </div>
                    <div class="prop-group">
                        <label>Height</label>
                        <input type="number" class="prop-control" value="${Math.round(el.height)}" oninput="updateProp('height', this.value)">
                    </div>
                </div>
            `;

        if (el.type === 'text') {
            html += `
                    <div style="border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 4px;"></div>
                    <div class="prop-group">
                        <label>Font Family</label>
                        <select class="prop-control" onchange="updateProp('fontFamily', this.value)">
                            <option value="sans-serif" ${el.fontFamily === 'sans-serif' ? 'selected' : ''}>Sans-Serif</option>
                            <option value="serif" ${el.fontFamily === 'serif' ? 'selected' : ''}>Serif</option>
                            <option value="monospace" ${el.fontFamily === 'monospace' ? 'selected' : ''}>Monospace</option>
                        </select>
                    </div>
                    <div class="prop-row">
                        <div class="prop-group">
                            <label>Font Size (px)</label>
                            <input type="number" class="prop-control" value="${el.fontSize}" oninput="updateProp('fontSize', this.value)">
                        </div>
                        <div class="prop-group">
                            <label>Text Color</label>
                            <input type="color" class="prop-control" value="${el.fontColor}" style="height: 34px; padding: 2px;" oninput="updateProp('fontColor', this.value)">
                        </div>
                    </div>
                `;
        }

        html += `
                <div style="border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 4px;"></div>
                <div class="prop-group">
                    <label>Background Color</label>
                    <input type="color" class="prop-control" value="${el.bg === 'transparent' ? '#ffffff' : el.bg}" style="height: 34px; padding: 2px;" oninput="updateProp('bg', this.value)">
                </div>
                <div class="prop-row">
                    <div class="prop-group">
                        <label>Border Color</label>
                        <input type="color" class="prop-control" value="${el.borderCol === 'transparent' ? '#000000' : el.borderCol}" style="height: 34px; padding: 2px;" oninput="updateProp('borderCol', this.value)">
                    </div>
                    <div class="prop-group">
                        <label>Border Width (px)</label>
                        <input type="number" class="prop-control" min="0" max="20" value="${el.borderWidth}" oninput="updateProp('borderWidth', this.value)">
                    </div>
                </div>
                <div class="prop-group">
                    <label>Border Style</label>
                    <select class="prop-control" onchange="updateProp('borderStyle', this.value)">
                        <option value="solid" ${el.borderStyle === 'solid' ? 'selected' : ''}>Solid</option>
                        <option value="dashed" ${el.borderStyle === 'dashed' ? 'selected' : ''}>Dashed</option>
                        <option value="dotted" ${el.borderStyle === 'dotted' ? 'selected' : ''}>Dotted</option>
                        <option value="none" ${el.borderStyle === 'none' ? 'selected' : ''}>None</option>
                    </select>
                </div>
            `;

        panelBody.innerHTML = html;
    }

    function updateProp(propName, value) {
        const currentSlide = slides[currentSlideIndex];
        if (selectedElementIndex === null || !currentSlide) return;
        const el = currentSlide.elements[selectedElementIndex];

        if (['x', 'y', 'width', 'height', 'fontSize', 'borderWidth'].includes(propName)) {
            el[propName] = Number(value);
        } else {
            el[propName] = value;
        }

        renderCanvas();
        updateThumbnailLive();
    }

    async function triggerExport(type) {
        document.getElementById('export-menu').classList.remove('show');

        if (type === 'pdf') {
            const exportContainer = document.getElementById('print-export-container');
            exportContainer.innerHTML = '';
            exportContainer.style.display = 'block';
            exportContainer.style.position = 'absolute';
            exportContainer.style.left = '-9999px';

            slides.forEach((s) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'print-slide';
                slideDiv.style.width = `${slideWidth}px`;
                slideDiv.style.height = `${slideHeight}px`;
                slideDiv.style.position = 'relative';
                slideDiv.style.background = '#ffffff';
                slideDiv.style.overflow = 'hidden';

                s.elements.forEach(el => {
                    let style = `position: absolute; left:${el.x}px; top:${el.y}px; width:${el.width}px; height:${el.height}px; background-color:${el.bg}; border: ${el.borderWidth}px ${el.borderStyle} ${el.borderCol}; box-sizing: border-box;`;
                    if (el.type === 'text') {
                        style += `font-size:${el.fontSize}px; font-family:${el.fontFamily}; color:${el.fontColor}; padding:8px;`;
                        const tempDiv = document.createElement('div');
                        tempDiv.style.cssText = style;
                        renderKatexContent(tempDiv, el.content);
                        slideDiv.appendChild(tempDiv);
                    } else {
                        const shapeDiv = document.createElement('div');
                        shapeDiv.style.cssText = style;
                        slideDiv.appendChild(shapeDiv);
                    }
                });
                exportContainer.appendChild(slideDiv);
            });

            try {
                const slideElements = exportContainer.querySelectorAll('.print-slide');
                const imageDataList = [];

                for (let slideEl of slideElements) {
                    const canvas = await html2canvas(slideEl, {scale: 2, useCORS: true, logging: false});
                    imageDataList.push(canvas.toDataURL('image/jpeg', 0.95));
                }

                exportContainer.style.display = 'none';

                if (window.pywebview && window.pywebview.api) {
                    const res = await window.pywebview.api.save_pdf_from_images(imageDataList, "presentation.pdf");
                    if (res.success) {
                        alert(`Successfully exported presentation to: ${res.path}`);
                    } else if (res.error !== "Cancelled") {
                        alert(`Export failed: ${res.error}`);
                    }
                }
            } catch (err) {
                exportContainer.style.display = 'none';
                alert(`PDF Export error: ${err.message}`);
            }
            return;
        }
        // Fetch KaTeX CSS and embed it inline so the exported file is self-contained
        let katexCss = '';
        try {
            const resp = await fetch('libs/katex.min.css');
            katexCss = await resp.text();
            // Rewrite relative font URLs to absolute CDN paths so fonts load too
            katexCss = katexCss.replace(/url\((?!["']?(?:data:|https?:))/g,
                'url(https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/');
        } catch (e) {
            console.warn('Could not load KaTeX CSS for export:', e);
        }
        // Interactive HTML Export
        let htmlContent = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Presentation Viewer</title>
            <style>${katexCss}</style>
            <style>
                body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; overflow: hidden; }
                .slide-wrapper { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; }
                .slide { width: ${slideWidth}px; height: ${slideHeight}px; aspect-ratio: 16 / 9; background: #fff; position: absolute; box-shadow: 0 25px 50px rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; display: none; }
                .slide.active { display: block; }
                .el { position: absolute; box-sizing: border-box; }
                .katex-mathml { display: none !important; }
                .nav-hint { position: fixed; bottom: 20px; color: #94a3b8; font-size: 14px; pointer-events: none; z-index: 1000; }
            </style></head><body><div class="slide-wrapper">`;

        // Temporarily build slides and render math on screen or clone them to capture exact HTML
        slides.forEach((s, idx) => {
            htmlContent += `<div class="slide ${idx === 0 ? 'active' : ''}" id="slide-${idx}">`;
            s.elements.forEach(el => {
                let style = `left:${el.x}px; top:${el.y}px; width:${el.width}px; height:${el.height}px; background-color:${el.bg}; border: ${el.borderWidth}px ${el.borderStyle} ${el.borderCol};`;
                if (el.type === 'text') {
                    style += `font-size:${el.fontSize}px; font-family:${el.fontFamily}; color:${el.fontColor}; padding:8px;`;

                    // Render into a temporary DOM element so KaTeX outputs its full HTML spans
                    const tempDiv = document.createElement('div');
                    renderKatexContent(tempDiv, el.content);
                    htmlContent += `<div class="el" style="${style}">${tempDiv.innerHTML}</div>`;
                } else {
                    htmlContent += `<div class="el" style="${style}"></div>`;
                }
            });
            htmlContent += `</div>`;
        });

        htmlContent += `</div><div class="nav-hint">Use [Space] or [→] to go forward, [←] to go backward</div>`;
        htmlContent += `<script>
                let current = 0;
                const total = ${slides.length};
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' || e.code === 'ArrowRight') {
                        if (current < total - 1) {
                            document.getElementById('slide-' + current).classList.remove('active');
                            current++;
                            document.getElementById('slide-' + current).classList.add('active');
                        }
                    } else if (e.code === 'ArrowLeft') {
                        if (current > 0) {
                            document.getElementById('slide-' + current).classList.remove('active');
                            current--;
                            document.getElementById('slide-' + current).classList.add('active');
                        }
                    }
                });
            <\/script></body></html>`;

        if (window.pywebview && window.pywebview.api) {
            const res = await window.pywebview.api.save_file(htmlContent, "presentation.html", "html");
            if (res.success) {
                alert(`Successfully exported presentation to: ${res.path}`);
            } else if (res.error !== "Cancelled") {
                alert(`Export failed: ${res.error}`);
            }
        } else {
            const blob = new Blob([htmlContent], {type: 'text/html'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'presentation.html';
            a.click();
            URL.revokeObjectURL(url);
        }
    }
</script>
