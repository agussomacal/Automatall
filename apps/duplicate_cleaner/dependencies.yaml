# microApps/DuplicateFinder/dependencies.yaml
# Required dependencies for Duplicate Finder app

dependencies:
  # GTK4 DuplicateFinderGUI framework
  - name: gtk4
    binary: g++
    description: "GTK 4 graphical toolkit"
    optional: false
    install_commands:
      apt: "sudo apt install -y libgtk-4-1 gir1.2-gtk-4.0 libgtk-4-dev"
      dnf: "sudo dnf install -y gtk4 gtk4-devel"
      pacman: "sudo pacman -S gtk4"
      brew: "brew install gtk4"
    version_flag: "--version"

  # Libadwaita for modern GNOME desktop styling
  - name: libadwaita
    binary: adw-1
    description: "GNOME Libadwaita for modern widget styling"
    optional: false
    install_commands:
      apt: "sudo apt install -y libadwaita-1-0 gir1.2-adw-1 libadwaita-1-dev"
      dnf: "sudo dnf install -y libadwaita libadwaita-devel"
      pacman: "sudo pacman -S libadwaita"
      brew: "brew install libadwaita"
    version_flag: "--version"

  # hashlib (Python standard library, no install needed)
  # pathlib (Python standard library, no install needed)